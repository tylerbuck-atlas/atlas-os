[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-sdk"
version = "0.3.0"
description = "Atlas OS SDK — service registration, discovery, and Event Bus client"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Tyler Buck", email = "tyler.buck123@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
include = ["atlas_sdk*"]
