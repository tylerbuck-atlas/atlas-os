[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-sdk"
version = "0.2.0"
description = "Atlas OS SDK — service registration, discovery, and Event Bus client"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["atlas_sdk*"]
