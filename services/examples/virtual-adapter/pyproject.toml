[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-adapter-virtual"
version = "0.3.0"
description = "atlas.adapter.virtual — reference device adapter (simulated household)"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Tyler Buck", email = "tyler.buck123@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "atlas-sdk",
]

[tool.setuptools.packages.find]
include = ["atlas_adapter_virtual*"]
