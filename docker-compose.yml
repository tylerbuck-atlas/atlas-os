name: atlas-os

services:
  atlas-core:
    build: ./services/core
    container_name: atlas-core
    environment:
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_DATABASE_PATH: /app/data/atlas-core.db
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - atlas-core-data:/app/data
    networks: [atlas]
    restart: unless-stopped

  atlas-echo:
    build: ./services/examples/echo
    container_name: atlas-echo
    environment:
      ATLAS_CORE_URL: http://atlas-core:8000
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_ECHO_URL: http://atlas-echo:8100
    ports:
      - "8100:8100"
    networks: [atlas]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

networks:
  atlas:
    name: atlas
    driver: bridge

volumes:
  atlas-core-data:
