name: atlas-os

# Network topology enforces the Local-First Rule (docs/privacy.md):
#
#   atlas       internal-only — service↔service traffic; NO route anywhere
#   atlas-edge  host/LAN reachability for published ports; NAT masquerade
#               is DISABLED, so containers cannot INITIATE connections to
#               the internet or LAN. Inbound published ports still work.
#
# A future adapter that legitimately needs the internet must join its own
# explicitly-defined egress network — one visible place to audit.

services:
  atlas-core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    container_name: atlas-core
    environment:
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_DATABASE_PATH: /app/data/atlas-core.db
      ATLAS_CA_DIR: /app/data/ca
      ATLAS_CORE_HOSTNAMES: atlas-core,localhost
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - atlas-core-data:/app/data
    networks: [atlas, atlas-edge]
    restart: unless-stopped

  atlas-eventbus:
    build:
      context: .
      dockerfile: services/eventbus/Dockerfile
    container_name: atlas-eventbus
    environment:
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_EVENTBUS_CORE_URL: https://atlas-core:8000
      ATLAS_EVENTBUS_SELF_URL: https://atlas-eventbus:8200
      ATLAS_EVENTBUS_DATABASE_PATH: /app/data/atlas-eventbus.db
      ATLAS_EVENTBUS_TLS_DIR: /app/data/tls
    ports:
      - "8200:8200"
    volumes:
      - atlas-eventbus-data:/app/data
    networks: [atlas, atlas-edge]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

  atlas-memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    container_name: atlas-memory
    environment:
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_MEMORY_CORE_URL: https://atlas-core:8000
      ATLAS_MEMORY_SELF_URL: https://atlas-memory:8300
      ATLAS_MEMORY_DATABASE_PATH: /app/data/atlas-memory.db
      ATLAS_MEMORY_TLS_DIR: /app/data/tls
    ports:
      - "8300:8300"
    volumes:
      - atlas-memory-data:/app/data
    networks: [atlas, atlas-edge]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

  atlas-assets:
    build:
      context: .
      dockerfile: services/assets/Dockerfile
    container_name: atlas-assets
    environment:
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_ASSETS_CORE_URL: https://atlas-core:8000
      ATLAS_ASSETS_SELF_URL: https://atlas-assets:8400
      ATLAS_ASSETS_DATABASE_PATH: /app/data/atlas-assets.db
      ATLAS_ASSETS_BLOB_DIR: /app/data/blobs
      ATLAS_ASSETS_TLS_DIR: /app/data/tls
    ports:
      - "8400:8400"
    volumes:
      - atlas-assets-data:/app/data
    networks: [atlas, atlas-edge]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

  atlas-planner:
    build:
      context: .
      dockerfile: services/planner/Dockerfile
    container_name: atlas-planner
    environment:
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_PLANNER_CORE_URL: https://atlas-core:8000
      ATLAS_PLANNER_SELF_URL: https://atlas-planner:8500
      ATLAS_PLANNER_DATABASE_PATH: /app/data/atlas-planner.db
      ATLAS_PLANNER_TLS_DIR: /app/data/tls
    ports:
      - "8500:8500"
    volumes:
      - atlas-planner-data:/app/data
    networks: [atlas, atlas-edge]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

  atlas-sentinel:
    build:
      context: .
      dockerfile: services/sentinel/Dockerfile
    container_name: atlas-sentinel
    environment:
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_SENTINEL_CORE_URL: https://atlas-core:8000
      ATLAS_SENTINEL_SELF_URL: https://atlas-sentinel:8600
      ATLAS_SENTINEL_DATABASE_PATH: /app/data/atlas-sentinel.db
      ATLAS_SENTINEL_TLS_DIR: /app/data/tls
    ports:
      - "8600:8600"
    volumes:
      - atlas-sentinel-data:/app/data
    networks: [atlas, atlas-edge]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

  atlas-devices:
    build:
      context: .
      dockerfile: services/devices/Dockerfile
    container_name: atlas-devices
    environment:
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_DEVICES_CORE_URL: https://atlas-core:8000
      ATLAS_DEVICES_SELF_URL: https://atlas-devices:8700
      ATLAS_DEVICES_DATABASE_PATH: /app/data/atlas-devices.db
      ATLAS_DEVICES_TLS_DIR: /app/data/tls
    ports:
      - "8700:8700"
    volumes:
      - atlas-devices-data:/app/data
    networks: [atlas, atlas-edge]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

  atlas-skills:
    build:
      context: .
      dockerfile: services/skills/Dockerfile
    container_name: atlas-skills
    environment:
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_SKILLS_CORE_URL: https://atlas-core:8000
      ATLAS_SKILLS_SELF_URL: https://atlas-skills:8800
      ATLAS_SKILLS_DATABASE_PATH: /app/data/atlas-skills.db
      ATLAS_SKILLS_TLS_DIR: /app/data/tls
    ports:
      - "8800:8800"
    volumes:
      - atlas-skills-data:/app/data
    networks: [atlas, atlas-edge]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

  # The reference adapter simulates devices, so it needs no LAN access.
  # A REAL protocol adapter (MQTT/Zigbee/Z-Wave) is the privacy contract's
  # "explicit egress adapter": give it LAN reach by ALSO joining a
  # dedicated network, e.g.
  #     networks: [atlas, atlas-lan]
  # with:
  #     atlas-lan:
  #       driver: macvlan          # or a masquerading bridge for IP-only
  #       driver_opts: {parent: eth0}
  # That grant is visible here, in one place, and applies to that adapter
  # alone — the rest of Atlas stays egress-denied. USB coordinators
  # (Zigbee/Z-Wave sticks) instead map the device: ["/dev/ttyUSB0:..."].
  atlas-adapter-virtual:
    build:
      context: .
      dockerfile: services/examples/virtual-adapter/Dockerfile
    container_name: atlas-adapter-virtual
    environment:
      ATLAS_CORE_URL: https://atlas-core:8000
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_ADAPTER_URL: https://atlas-adapter-virtual:8900
      ATLAS_ADAPTER_TLS_DIR: /tmp/atlas-tls
    ports:
      - "8900:8900"
    networks: [atlas, atlas-edge]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

  # The AI arrives last, as designed. Default backend is the built-in
  # deterministic stub (zero model, zero egress). For real local
  # inference, run Ollama on this machine and set ATLAS_AI_BACKEND=ollama:
  # reaching the host is this service's explicit local-inference grant —
  # uncomment extra_hosts below. Cloud model backends do not exist in
  # this codebase; per docs/privacy.md they would be a separate, opt-in
  # adapter, never eligible for Class-3 data.
  atlas-ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: atlas-ai
    environment:
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_AI_CORE_URL: https://atlas-core:8000
      ATLAS_AI_SELF_URL: https://atlas-ai:9000
      ATLAS_AI_DATABASE_PATH: /app/data/atlas-ai.db
      ATLAS_AI_TLS_DIR: /app/data/tls
      ATLAS_AI_BACKEND: ${ATLAS_AI_BACKEND:-stub}
      ATLAS_AI_MODEL_URL: ${ATLAS_AI_MODEL_URL:-http://host.docker.internal:11434}
      ATLAS_AI_MODEL_NAME: ${ATLAS_AI_MODEL_NAME:-qwen3:14b}
    # extra_hosts:                       # ← the local-inference grant
    #   - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
    volumes:
      - atlas-ai-data:/app/data
    networks: [atlas, atlas-edge]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

  atlas-echo:
    build:
      context: .
      dockerfile: services/examples/echo/Dockerfile
    container_name: atlas-echo
    environment:
      ATLAS_CORE_URL: https://atlas-core:8000
      ATLAS_BOOTSTRAP_TOKEN: ${ATLAS_BOOTSTRAP_TOKEN:?Set ATLAS_BOOTSTRAP_TOKEN in .env}
      ATLAS_SECURITY_MODE: ${ATLAS_SECURITY_MODE:-mtls}
      ATLAS_ECHO_URL: https://atlas-echo:8100
      ATLAS_ECHO_TLS_DIR: /tmp/atlas-tls
    ports:
      - "8100:8100"
    networks: [atlas, atlas-edge]
    depends_on:
      atlas-core:
        condition: service_healthy
    restart: unless-stopped

networks:
  atlas:
    name: atlas
    driver: bridge
    internal: true
  atlas-edge:
    name: atlas-edge
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  atlas-core-data:
  atlas-eventbus-data:
  atlas-memory-data:
  atlas-assets-data:
  atlas-planner-data:
  atlas-sentinel-data:
  atlas-devices-data:
  atlas-skills-data:
  atlas-ai-data:
